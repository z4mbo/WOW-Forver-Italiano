name: Validate addon

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-dev.txt
      - run: python tools/validate-lua.py
      - run: python tools/smoke-test.py
      - run: python tools/test-dynamic-spell.py
      - run: python tools/check-spell-renderability.py
      - run: python tools/test-missing-spell-body.py
      - run: python tools/test-item-description-override.py
      - shell: pwsh
        run: ./tools/build-release.ps1
